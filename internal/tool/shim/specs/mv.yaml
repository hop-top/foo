# mv: move or rename. The source entry is removed from its directory,
# so it needs write; it needs read too, since a move across filesystems
# copies the content first. Never replaces an existing destination
# unless overwrite=true (then destructive). /, $HOME and entries
# directly under / are refused as a source or as where dst lands,
# whatever the scope (protect_roots).
spec: 1
name: mv
description: >-
  Move or rename files or directories. With several sources, dst must
  be an existing directory; an existing directory dst receives each
  source under its own name. Never replaces an existing file unless
  overwrite=true, and never an existing directory. A link is moved as
  the link itself. Never moves /, the home directory or an entry
  directly under /, nor puts anything there.
command:
  bin: [/bin/mv, /usr/bin/mv]
side_effect: write
side_effect_if:
  - when: {overwrite: true}
    side_effect: destructive
network: none
timeout: 60s
ok_exit_codes: [0]
output: text
params:
  - name: src
    type: path
    description: Files or directories to move.
    op: [read, write]
    target: dirent
    repeated: true
    max_items: 64
    must_exist: true
    recursive: true
    recursion: all_or_nothing
    protect_roots: true
  - name: dst
    type: path
    description: New path, or an existing directory to move into.
    op: [write]
    target: dirent
    into_dir: true
    recursive: true
    recursion: all_or_nothing
    clobber_when: {overwrite: true}
    protect_roots: true
  - name: overwrite
    type: bool
    description: Replace an existing destination file.
    default: false
    argv: {false: ["-n"]}
argv: ["{overwrite}", "--", "{src}", "{dst}"]
