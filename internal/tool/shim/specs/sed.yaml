# sed: one substitution per call, generated by foo from typed params;
# the model never supplies a sed script. In place = destructive;
# dry_run prints the result and changes nothing. replace is literal
# (foo escapes & and backslashes) unless backrefs=true.
spec: 1
name: sed
description: >-
  Replace text in files with one substitution: find is a regular
  expression (basic, or extended with extended=true), replace is the
  text put in its place, taken literally unless backrefs=true. Edits
  the files in place unless dry_run=true, which prints the result and
  changes nothing. Replaces the first match per line unless global=true
  or occurrence is set.
command:
  bin: [/usr/bin/sed, /bin/sed]
  variants:
    gnu:
      prefix: ["--sandbox"]
    bsd:
      params:
        dry_run: {argv: {false: ["-i", ""]}}
side_effect: destructive
side_effect_if:
  - when: {dry_run: true}
    side_effect: read
network: none
timeout: 30s
ok_exit_codes: [0]
output: text
params:
  - name: path
    type: path
    description: Files to edit.
    op: [read, write]
    repeated: true
    max_items: 16
    must_exist: true
    kind: file
  - name: find
    type: string
    description: Regular expression to match; no newlines.
    required: true
    max_len: 1024
    pattern: ".+"
  - name: replace
    type: string
    description: >-
      Replacement text, inserted literally: & and backslashes are plain
      characters. Set backrefs=true to use & and \1 to \9. No newlines.
    required: true
    max_len: 1024
  - name: backrefs
    type: bool
    description: >-
      Read replace with sed syntax: & is the whole match, \1 to \9 are
      groups, \& and \\ are a literal & and backslash; replace may not
      end in a lone backslash.
    default: false
  - name: global
    type: bool
    description: Replace every match on a line.
    default: false
  - name: ignore_case
    type: bool
    description: Match case-insensitively.
    default: false
  - name: occurrence
    type: int
    description: Replace only the Nth match on each line.
    min: 1
    max: 512
  - name: extended
    type: bool
    description: Use extended regular expressions (+ ? | and bare groups).
    default: false
    argv: {true: ["-E"]}
  - name: dry_run
    type: bool
    description: Print the result instead of editing the files.
    default: false
    argv: {false: ["-i"]}
exclusive: [[global, occurrence]]
script:
  kind: sed_substitute
  find: find
  replace: replace
  flags: {global: g, ignore_case: I}
  occurrence: occurrence
  backrefs: backrefs
argv: ["{dry_run}", "{extended}", "-e", "{script}", "--", "{path}"]
